name: Auto-Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

env:
  AWS_REGION: "ap-southeast-1"                           # Singapore region
  EB_APPLICATION_NAME: "vmas-backend"                     # Your Beanstalk App Name
  EB_ENVIRONMENT_NAME: "Vmas-backend-env"                 # Your Beanstalk Environment Name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build the jar inside V-Mas Backend directory
      - name: Build with Maven
        run: |
          cd "V-Mas Backend"
          mvn clean package -DskipTests

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: backend-jar-${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: "V-Mas Backend/target/vmas-backend-0.0.1-SNAPSHOT.jar"
