spring.application.name=vmas-backend
# Activate 'local' profile for development (loads application-local.properties)
# In production, override with: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration
# AWS RDS endpoint (ap-southeast-1 Singapore)
# Override with env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://18.136.227.181:3306/vmas_db?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Vmas2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1


# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Init - runs data.sql to seed default users (admin/controller/driver)
spring.sql.init.mode=always

# Flyway Configuration for database migrations
spring.flyway.enabled=false
spring.flyway.baselineOnMigrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# File Upload Configuration (for service bill attachments)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload storage directory (relative to backend working directory)
app.upload.dir=uploads/service-attachments

# AWS S3 Storage configuration
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ── SendGrid (Password Reset Email) ──────────────────────────────────────────
# Override via environment variables or application-local.properties (gitignored)
sendgrid.api-key=${SENDGRID_API_KEY:your-sendgrid-api-key}

# Verified sender address in your SendGrid account (Settings → Sender Authentication)
mail.from.email=${MAIL_FROM_EMAIL:noreply@yourdomain.com}
mail.from.name=${MAIL_FROM_NAME:V-MAS}

# Frontend base URL — used in the reset-link inside the email
app.frontend.url=${APP_FRONTEND_URL:https://v-mas.vercel.app}


